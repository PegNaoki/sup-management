<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストップウォッチ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@300;400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080810;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* Ambient glow background */
    body::before {
      content: '';
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: linear-gradient(145deg, #13131f, #0d0d18);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 32px;
      padding: 48px 56px 40px;
      width: 480px;
      box-shadow:
        0 0 0 1px rgba(99,102,241,0.1),
        0 40px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }

    .title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #374151;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.running {
      background: #22c55e;
      box-shadow: 0 0 12px rgba(34,197,94,0.6);
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 8px rgba(34,197,94,0.6); }
      50% { box-shadow: 0 0 20px rgba(34,197,94,0.9); }
    }

    /* Ring display */
    .ring-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
      position: relative;
    }

    .ring-svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
    }

    .ring-bg {
      fill: none;
      stroke: rgba(255,255,255,0.04);
      stroke-width: 3;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ringGradient);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 754;
      stroke-dashoffset: 754;
      transition: stroke-dashoffset 0.1s linear;
      transform: rotate(-90deg);
      transform-origin: center;
    }

    .display-wrapper {
      width: 220px;
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .display-main {
      font-family: 'JetBrains Mono', monospace;
      font-size: 4rem;
      font-weight: 300;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .display-ms {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      font-weight: 300;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.05em;
      margin-top: 6px;
    }

    /* Buttons */
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .btn {
      position: relative;
      padding: 14px 0;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.07);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .btn:hover::before { opacity: 1; }
    .btn:active { transform: scale(0.97); }

    .btn:disabled {
      opacity: 0.25;
      cursor: default;
    }
    .btn:disabled::before { display: none; }

    .btn-start {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #000;
      box-shadow: 0 4px 20px rgba(34,197,94,0.3);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      box-shadow: 0 4px 20px rgba(239,68,68,0.3);
    }

    .btn-lap {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      box-shadow: 0 4px 20px rgba(99,102,241,0.3);
    }

    .btn-reset {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: none;
    }

    /* Lap list */
    .laps-header {
      display: flex;
      justify-content: space-between;
      padding: 0 4px 8px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }

    .laps {
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.08) transparent;
    }

    .laps::-webkit-scrollbar { width: 3px; }
    .laps::-webkit-scrollbar-track { background: transparent; }
    .laps::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    .lap-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      animation: lap-in 0.2s ease;
    }

    @keyframes lap-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .lap-num {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.25);
      font-weight: 500;
      min-width: 48px;
    }

    .lap-bar {
      flex: 1;
      height: 2px;
      background: rgba(255,255,255,0.05);
      border-radius: 1px;
      margin: 0 12px;
      overflow: hidden;
    }

    .lap-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #22c55e);
      border-radius: 1px;
    }

    .lap-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 400;
      color: rgba(255,255,255,0.7);
      font-variant-numeric: tabular-nums;
    }

    .lap-item.fastest .lap-time { color: #22c55e; }
    .lap-item.slowest .lap-time  { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <span class="title">Stopwatch</span>
      <div class="status-dot" id="statusDot"></div>
    </div>

    <div class="ring-wrapper">
      <svg class="ring-svg" viewBox="0 0 260 260">
        <defs>
          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#22c55e"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="130" cy="130" r="120"/>
        <circle class="ring-progress" id="ringProgress" cx="130" cy="130" r="120"/>
      </svg>
      <div class="display-wrapper">
        <div class="display-main" id="time">00:00</div>
        <div class="display-ms" id="ms">.00</div>
      </div>
    </div>

    <div class="buttons">
      <button class="btn btn-start" id="btn-start">Start</button>
      <button class="btn btn-stop"  id="btn-stop"  disabled>Stop</button>
      <button class="btn btn-lap"   id="btn-lap"   disabled>Lap</button>
      <button class="btn btn-reset" id="btn-reset">Reset</button>
    </div>

    <div class="laps-header">
      <span>Lap</span>
      <span>Time</span>
    </div>
    <div class="laps" id="laps"></div>
  </div>

  <script>
    let startTime = 0, elapsed = 0, rafId = null;
    let lapCount = 0, lapStart = 0;
    let lapTimes = [];

    const timeEl   = document.getElementById('time');
    const msEl     = document.getElementById('ms');
    const lapsEl   = document.getElementById('laps');
    const dot      = document.getElementById('statusDot');
    const ring     = document.getElementById('ringProgress');
    const btnStart = document.getElementById('btn-start');
    const btnStop  = document.getElementById('btn-stop');
    const btnReset = document.getElementById('btn-reset');
    const btnLap   = document.getElementById('btn-lap');

    const RING_CIRC = 2 * Math.PI * 120;
    const RING_CYCLE = 60000; // 1 minute = full ring

    function format(ms) {
      const totalSec = Math.floor(ms / 1000);
      const min = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const sec = (totalSec % 60).toString().padStart(2, '0');
      const cs  = Math.floor((ms % 1000) / 10).toString().padStart(2, '0');
      return { main: `${min}:${sec}`, cs };
    }

    function updateRing(ms) {
      const progress = (ms % RING_CYCLE) / RING_CYCLE;
      ring.style.strokeDashoffset = RING_CIRC * (1 - progress);
    }

    function tick() {
      elapsed = Date.now() - startTime;
      const { main, cs } = format(elapsed);
      timeEl.textContent = main;
      msEl.textContent   = '.' + cs;
      updateRing(elapsed);
      rafId = requestAnimationFrame(tick);
    }

    function renderLaps() {
      if (!lapTimes.length) { lapsEl.innerHTML = ''; return; }
      const min = Math.min(...lapTimes);
      const max = Math.max(...lapTimes);
      const maxT = max || 1;
      lapsEl.innerHTML = lapTimes.map((t, i) => {
        const { main, cs } = format(t);
        const cls = lapTimes.length > 1
          ? (t === min ? 'fastest' : t === max ? 'slowest' : '')
          : '';
        const pct = (t / maxT * 100).toFixed(1);
        return `<div class="lap-item ${cls}">
          <span class="lap-num">Lap ${lapTimes.length - i}</span>
          <div class="lap-bar"><div class="lap-bar-fill" style="width:${pct}%"></div></div>
          <span class="lap-time">${main}.${cs}</span>
        </div>`;
      }).join('');
    }

    btnStart.addEventListener('click', () => {
      startTime = Date.now() - elapsed;
      if (!lapStart) lapStart = startTime;
      rafId = requestAnimationFrame(tick);
      dot.classList.add('running');
      btnStart.disabled = true;
      btnStop.disabled  = false;
      btnLap.disabled   = false;
      btnStart.textContent = 'Start';
    });

    btnStop.addEventListener('click', () => {
      cancelAnimationFrame(rafId);
      dot.classList.remove('running');
      btnStop.disabled  = true;
      btnLap.disabled   = true;
      btnStart.disabled = false;
      btnStart.textContent = 'Resume';
    });

    btnReset.addEventListener('click', () => {
      cancelAnimationFrame(rafId);
      elapsed = lapCount = lapStart = 0;
      lapTimes = [];
      timeEl.textContent = '00:00';
      msEl.textContent   = '.00';
      ring.style.strokeDashoffset = RING_CIRC;
      dot.classList.remove('running');
      btnStart.disabled = false;
      btnStart.textContent = 'Start';
      btnStop.disabled  = true;
      btnLap.disabled   = true;
      renderLaps();
    });

    btnLap.addEventListener('click', () => {
      lapCount++;
      const now = Date.now();
      lapTimes.unshift(now - lapStart);
      lapStart = now;
      renderLaps();
    });

    ring.style.strokeDashoffset = RING_CIRC;
  </script>
</body>
</html>

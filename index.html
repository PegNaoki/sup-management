<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストップウォッチ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Courier New', monospace;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: #888;
      font-size: 1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .display {
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 700;
      color: #f0f0f0;
      letter-spacing: 0.05em;
      margin-bottom: 2.5rem;
      font-variant-numeric: tabular-nums;
    }

    .display .ms {
      font-size: 0.5em;
      color: #aaa;
    }

    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 0.8rem 2rem;
      font-size: 1rem;
      font-family: inherit;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.96);
    }

    #btn-start {
      background: #22c55e;
      color: #000;
      font-weight: 700;
    }

    #btn-stop {
      background: #ef4444;
      color: #fff;
      font-weight: 700;
    }

    #btn-reset {
      background: #333;
      color: #aaa;
    }

    #btn-lap {
      background: #3b82f6;
      color: #fff;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .laps {
      margin-top: 2rem;
      max-height: 240px;
      overflow-y: auto;
      width: 320px;
      margin-left: auto;
      margin-right: auto;
    }

    .laps::-webkit-scrollbar {
      width: 4px;
    }
    .laps::-webkit-scrollbar-track { background: transparent; }
    .laps::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .lap-item {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0.8rem;
      color: #888;
      font-size: 0.9rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .lap-item span:first-child {
      color: #555;
    }

    .lap-item span:last-child {
      color: #ccc;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stopwatch</h1>
    <div class="display">
      <span id="time">00:00</span><span class="ms">.<span id="ms">00</span></span>
    </div>
    <div class="buttons">
      <button id="btn-start">START</button>
      <button id="btn-stop" disabled>STOP</button>
      <button id="btn-lap" disabled>LAP</button>
      <button id="btn-reset">RESET</button>
    </div>
    <div class="laps" id="laps"></div>
  </div>

  <script>
    let startTime = 0;
    let elapsed = 0;
    let rafId = null;
    let lapCount = 0;
    let lapStart = 0;

    const timeEl = document.getElementById('time');
    const msEl = document.getElementById('ms');
    const lapsEl = document.getElementById('laps');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const btnReset = document.getElementById('btn-reset');
    const btnLap = document.getElementById('btn-lap');

    function format(ms) {
      const totalSec = Math.floor(ms / 1000);
      const min = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const sec = (totalSec % 60).toString().padStart(2, '0');
      const cs = Math.floor((ms % 1000) / 10).toString().padStart(2, '0');
      return { main: `${min}:${sec}`, cs };
    }

    function tick() {
      elapsed = Date.now() - startTime;
      const { main, cs } = format(elapsed);
      timeEl.textContent = main;
      msEl.textContent = cs;
      rafId = requestAnimationFrame(tick);
    }

    btnStart.addEventListener('click', () => {
      startTime = Date.now() - elapsed;
      if (!lapStart) lapStart = startTime;
      rafId = requestAnimationFrame(tick);
      btnStart.disabled = true;
      btnStop.disabled = false;
      btnLap.disabled = false;
    });

    btnStop.addEventListener('click', () => {
      cancelAnimationFrame(rafId);
      btnStop.disabled = true;
      btnLap.disabled = true;
      btnStart.disabled = false;
      btnStart.textContent = 'RESUME';
    });

    btnReset.addEventListener('click', () => {
      cancelAnimationFrame(rafId);
      elapsed = 0;
      lapCount = 0;
      lapStart = 0;
      timeEl.textContent = '00:00';
      msEl.textContent = '00';
      lapsEl.innerHTML = '';
      btnStart.disabled = false;
      btnStart.textContent = 'START';
      btnStop.disabled = true;
      btnLap.disabled = true;
    });

    btnLap.addEventListener('click', () => {
      lapCount++;
      const now = Date.now();
      const lapTime = now - lapStart;
      lapStart = now;
      const { main, cs } = format(lapTime);
      const item = document.createElement('div');
      item.className = 'lap-item';
      item.innerHTML = `<span>Lap ${lapCount}</span><span>${main}.${cs}</span>`;
      lapsEl.prepend(item);
    });
  </script>
</body>
</html>
